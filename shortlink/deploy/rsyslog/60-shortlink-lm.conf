# Forward to the LogicMonitor collector's syslog listener for LM Logs.
# @COLLECTOR_HOST@ is filled in at install time: the VM's private IP when the
# collector runs on the same VM. The collector listens on UDP 514; this VM's
# rsyslog does not (imudp stays off), so the two don't collide.
#
# Sent: everything Shortlink logs, plus warnings and worse from the rest of
# the OS and every auth/sshd event.
if ($programname == "shortlink") or ($syslogseverity <= 4) or ($syslogfacility-text == "authpriv") then {
  action(type="omfwd" target="@COLLECTOR_HOST@" port="514" protocol="udp"
         template="RSYSLOG_SyslogProtocol23Format"
         queue.type="LinkedList" queue.size="10000"
         action.resumeRetryCount="-1")
}
